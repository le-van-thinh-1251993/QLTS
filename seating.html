<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Security: Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com data:; img-src 'self' data: https://i.pravatar.cc https://ui-avatars.com; connect-src 'self' https://*.supabase.co https://cdn.jsdelivr.net;">
    <title>Sắp xếp chỗ ngồi - IT Asset Management</title>
    <script src="https://cdn.tailwindcss.com"></script> 
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Giữ nguyên màu mặc định
                    }
                }
            }
        }
    </script>
    <script>
        // Chạy ngay lập tức để tránh FOUC (Flash of Unstyled Content)
        if (localStorage.getItem('darkMode') === 'true') {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-sans text-slate-800 bg-slate-100 dark:bg-slate-900 dark:text-slate-100">
    <div class="relative min-h-screen md:flex">
        <!-- Mobile menu backdrop -->
        <div id="sidebar-backdrop" class="hidden md:hidden fixed inset-0 bg-black opacity-50 z-40"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="bg-slate-800 text-slate-200 w-64 space-y-6 py-7 px-2 absolute inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-200 ease-in-out z-50 flex flex-col">
            <div class="h-16 flex items-center justify-center border-b border-slate-700">
                <i class="fa-solid fa-cubes-stacked mr-3 text-2xl text-blue-400"></i>
                <h1 class="text-xl font-bold">IT-AMS</h1>
            </div>
            <nav class="flex-1 px-2 space-y-2">
                <a href="assets.html" class="nav-link flex items-center px-4 py-2.5 text-slate-300 hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-boxes-stacked sidebar-icon"></i><span class="ml-4">Kho tài sản</span>
                </a>
                <a href="licenses.html" class="nav-link flex items-center px-4 py-2.5 text-slate-300 hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-key sidebar-icon"></i><span class="ml-4">Quản lý License</span>
                </a>
                <a href="index.html" class="nav-link flex items-center px-4 py-2.5 text-slate-300 hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-chart-simple sidebar-icon"></i><span class="ml-4">Dashboard</span>
                </a>
                <a href="users.html" class="nav-link flex items-center px-4 py-2.5 text-slate-300 hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-users sidebar-icon"></i><span class="ml-4">Người dùng</span>
                </a>
                <a href="seating.html" class="nav-link flex items-center px-4 py-2.5 text-slate-100 bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-chair sidebar-icon"></i><span class="ml-4">Sắp xếp chỗ ngồi</span>
                </a>
                <a href="settings.html" class="nav-link flex items-center px-4 py-2.5 text-slate-300 hover:bg-slate-700 rounded-lg">
                    <i class="fa-solid fa-gear sidebar-icon"></i><span class="ml-4">Cài đặt</span>
                </a>
            </nav>
        </aside>

        <div class="flex-1 flex flex-col">
            <header class="h-16 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between px-6">
                <!-- Mobile menu button -->
                <button id="hamburger-button" class="md:hidden text-slate-500 focus:outline-none">
                    <i class="fa-solid fa-bars text-2xl"></i>
                </button>

                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-bold text-slate-800 dark:text-gray-200">Sắp xếp chỗ ngồi</h2>
                </div>
                <div class="flex items-center gap-3">
                    <select id="colorFilter" class="px-3 py-2 border-2 border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-700 text-slate-700 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all">
                        <option value="">Tất cả màu</option>
                    </select>
                    <input type="file" id="importExcelInput" class="hidden" accept=".xlsx, .xls">
                    <button id="importExcelBtn" class="px-4 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-file-import"></i>
                        <span class="hidden md:inline">Import Excel</span>
                    </button>
                    <button id="exportExcelBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-file-export"></i>
                        <span class="hidden md:inline">Export Excel</span>
                    </button>
                    <button id="addRowBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden md:inline">Thêm hàng</span>
                    </button>
                    <button id="addColBtn" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i>
                        <span class="hidden md:inline">Thêm cột</span>
                    </button>
                </div>
            </header>

            <main class="flex-1 p-6 overflow-auto bg-slate-50 dark:bg-slate-900">
                <div class="bg-white dark:bg-slate-800 rounded-lg shadow p-6">
                    <div class="mb-4 flex items-center gap-4 flex-wrap">
                        <label class="text-sm font-semibold dark:text-gray-200">Số hàng:</label>
                        <input type="number" id="rowsInput" min="1" max="20" value="5" class="w-20 px-3 py-1 border rounded dark:bg-slate-700 dark:border-slate-600 dark:text-gray-200">
                        <label class="text-sm font-semibold dark:text-gray-200">Số cột:</label>
                        <input type="number" id="colsInput" min="1" max="20" value="6" class="w-20 px-3 py-1 border rounded dark:bg-slate-700 dark:border-slate-600 dark:text-gray-200">
                        <button id="applyGridBtn" class="px-4 py-1 bg-blue-600 hover:bg-blue-700 text-white rounded">Áp dụng</button>
                        <button id="manageColorsBtn" class="px-4 py-1 bg-indigo-600 hover:bg-indigo-700 text-white rounded flex items-center gap-2">
                            <i class="fa-solid fa-palette"></i>
                            <span>Quản lý màu</span>
                        </button>
                        <button id="mergeCellsBtn" class="px-4 py-1 bg-orange-600 hover:bg-orange-700 text-white rounded flex items-center gap-2">
                            <i class="fa-solid fa-object-group"></i>
                            <span>Merge Cells</span>
                        </button>
                        <button id="unmergeCellsBtn" class="px-4 py-1 bg-gray-600 hover:bg-gray-700 text-white rounded flex items-center gap-2">
                            <i class="fa-solid fa-object-ungroup"></i>
                            <span>Unmerge</span>
                        </button>
                    </div>
                    
                    <div id="seatingGrid" class="grid gap-3 p-6 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-lg min-h-[400px] bg-slate-50 dark:bg-slate-800/50">
                        <!-- Grid sẽ được tạo động bằng JavaScript -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal: Thêm/Chỉnh sửa người -->
    <div id="personModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm" onclick="handleModalBackdropClick(event)">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md p-6 relative border dark:border-slate-700" onclick="event.stopPropagation()">
            <button class="close-modal absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"><i class="fa-solid fa-times text-2xl"></i></button>
            <h3 id="personModalTitle" class="text-xl font-bold mb-6 border-b pb-2 dark:text-gray-200 dark:border-slate-700">Thêm người</h3>
            <form id="personForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1 dark:text-gray-200">Tên</label>
                    <div class="relative">
                        <input type="text" id="personName" autocomplete="off" class="w-full border-2 border-slate-300 dark:border-slate-600 rounded-lg p-2.5 pr-8 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-gray-200 transition-all" placeholder="Tìm kiếm tên..." required>
                        <button type="button" id="clearNameBtn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-1">
                            <i class="fa-solid fa-times"></i>
                        </button>
                        <div id="nameDropdown" class="hidden absolute z-10 w-full mt-1 bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600 rounded-lg shadow-lg max-h-60 overflow-y-auto"></div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 dark:text-gray-200">Phòng ban</label>
                    <div class="relative">
                        <input type="text" id="personDepartment" autocomplete="off" class="w-full border-2 border-slate-300 dark:border-slate-600 rounded-lg p-2.5 pr-8 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-gray-200 transition-all" placeholder="Tìm kiếm phòng ban...">
                        <button type="button" id="clearDeptBtn" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-1">
                            <i class="fa-solid fa-times"></i>
                        </button>
                        <div id="deptDropdown" class="hidden absolute z-10 w-full mt-1 bg-white dark:bg-slate-700 border-2 border-slate-300 dark:border-slate-600 rounded-lg shadow-lg max-h-60 overflow-y-auto"></div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 dark:text-gray-200">Màu vị trí</label>
                    <div class="flex gap-2 flex-wrap">
                        <input type="color" id="personColor" value="#94a3b8" class="w-16 h-10 rounded border-2 border-slate-300 dark:border-slate-600 cursor-pointer">
                        <select id="colorPreset" class="flex-1 border-2 border-slate-300 dark:border-slate-600 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-gray-200 transition-all">
                            <option value="">Chọn màu mặc định...</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1 dark:text-gray-200">Ghi chú</label>
                    <textarea id="personNotes" rows="3" class="w-full border-2 border-slate-300 dark:border-slate-600 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 dark:bg-slate-700 dark:text-gray-200 transition-all"></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-2 border-t dark:border-slate-700">
                    <button type="button" class="close-modal px-4 py-2 bg-slate-100 rounded-lg dark:bg-slate-700 dark:text-gray-200">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Quản lý màu -->
    <div id="colorManageModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm" onclick="handleModalBackdropClick(event)">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-2xl p-6 relative border dark:border-slate-700 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <button class="close-color-modal absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300"><i class="fa-solid fa-times text-2xl"></i></button>
            <h3 class="text-xl font-bold mb-6 border-b pb-2 dark:text-gray-200 dark:border-slate-700">Quản lý màu phòng ban</h3>
            <div id="colorManageList" class="space-y-3">
                <!-- Sẽ được render bằng JS -->
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t dark:border-slate-700 mt-4">
                <button class="close-color-modal px-4 py-2 bg-slate-100 rounded-lg dark:bg-slate-700 dark:text-gray-200">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Modal: Confirm/Alert thay thế alert/confirm -->
    <div id="confirmModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md p-6 relative border dark:border-slate-700">
            <h3 id="confirmModalTitle" class="text-xl font-bold mb-4 dark:text-gray-200">Xác nhận</h3>
            <p id="confirmModalMessage" class="text-slate-700 dark:text-gray-300 mb-6"></p>
            <div class="flex justify-end gap-3">
                <button id="confirmModalCancel" class="px-4 py-2 bg-slate-100 rounded-lg dark:bg-slate-700 dark:text-gray-200">Hủy</button>
                <button id="confirmModalOk" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Modal: Alert thay thế alert -->
    <div id="alertModal" class="hidden fixed inset-0 bg-slate-900 bg-opacity-60 z-50 flex justify-center items-center backdrop-blur-sm">
        <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md p-6 relative border dark:border-slate-700">
            <h3 id="alertModalTitle" class="text-xl font-bold mb-4 dark:text-gray-200">Thông báo</h3>
            <p id="alertModalMessage" class="text-slate-700 dark:text-gray-300 mb-6"></p>
            <div class="flex justify-end">
                <button id="alertModalOk" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">Đóng</button>
            </div>
        </div>
    </div>

    <!-- Load config và auth (optional - seating vẫn hoạt động nếu không có) -->
    <script src="config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/seating.js"></script>
</body>
</html>
